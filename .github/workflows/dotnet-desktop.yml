name: StarfieldVT Build

on:
  push:
    branches:
      - main
    tags:
      - 'v**'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact-name: starfieldvt-windows
          - os: ubuntu-latest
            rid: linux-x64
            artifact-name: starfieldvt-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Get short SHA (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "SHORT_SHA=$('${{ github.sha }}'.Substring(0, 8))" >> $env:GITHUB_ENV

      - name: Get short SHA (Linux)
        if: runner.os == 'Linux'
        run: echo "SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-8)" >> $GITHUB_ENV

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StarfieldVT.sln

      - name: Test
        run: dotnet test StarfieldVT.Core.Tests/StarfieldVT.Core.Tests.csproj -c Release

      - name: Publish
        run: dotnet publish StarfieldVT/StarfieldVT.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish/${{ matrix.rid }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ matrix.artifact-name }}-${{ env.SHORT_SHA }}
          path: publish/${{ matrix.rid }}

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Set short git commit SHA
        run: echo "COMMIT_SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-8)" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Artifact uploads drop Unix permissions, so restore the Linux executable bit before zipping
      - name: Restore Linux executable permission
        run: chmod +x artifacts/starfieldvt-linux-*/StarfieldVT

      # Zip from inside each folder so the files sit at the top level of the zip
      - name: Zip artifacts
        run: |
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/${name}-${{ github.ref_name }}.zip" .)
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.zip"
